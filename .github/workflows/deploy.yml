name: Deploy

on:
  push:
    branches: [main]
  # Keep manual trigger as escape hatch
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - production

# Only one deploy at a time — newer pushes cancel in-progress deploys
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # Run tests before any deploy
  test:
    uses: ./.github/workflows/ci.yml

  # Auto-deploy to production on every push to main (after tests pass)
  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ubuntu
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /opt/sipsense
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build
            echo "Production deploy complete"

      - name: Health check
        run: |
          echo "Waiting 30s for containers to start…"
          sleep 30
          STATUS=$(curl -sf "${{ secrets.PRODUCTION_URL }}/api/health" | jq -r '.status' 2>/dev/null || echo "unreachable")
          echo "Health check: $STATUS"
          if [ "$STATUS" != "healthy" ]; then
            echo "::warning::Health check returned: $STATUS"
          fi
