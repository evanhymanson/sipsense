map $http_user_agent $is_bot {
    default 0;
    # Social bots
    ~*facebookexternalhit 1;
    ~*Twitterbot 1;
    ~*LinkedInBot 1;
    ~*Slackbot 1;
    ~*Discordbot 1;
    ~*WhatsApp 1;
    ~*Telegrambot 1;
    # Search engine crawlers
    ~*Googlebot 1;
    ~*bingbot 1;
    ~*YandexBot 1;
    ~*DuckDuckBot 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml application/xhtml+xml application/wasm font/woff2;
    gzip_min_length 256;

    # Dynamic sitemap from backend
    location = /sitemap.xml {
        proxy_pass http://backend:8000/seo/sitemap.xml;
        proxy_set_header Host $host;
    }

    # Bot prerendering for whiskey detail pages
    location ~ ^/whiskey/(\d+)$ {
        if ($is_bot) {
            rewrite ^/whiskey/(\d+)$ /seo/og/whiskey/$1 break;
            proxy_pass http://backend:8000;
        }
        try_files $uri /index.html;
    }

    # Bot prerendering for learn pages
    location ~ ^/learn(/.*)?$ {
        if ($is_bot) {
            rewrite ^(/learn.*)$ /seo/prerender$1 break;
            proxy_pass http://backend:8000;
        }
        try_files $uri /index.html;
    }

    # Bot prerendering for top lists
    location ~ ^/lists(/.*)?$ {
        if ($is_bot) {
            rewrite ^(/lists.*)$ /seo/prerender$1 break;
            proxy_pass http://backend:8000;
        }
        try_files $uri /index.html;
    }

    # Bot prerendering for homepage
    location = / {
        if ($is_bot) {
            rewrite ^ /seo/prerender/ break;
            proxy_pass http://backend:8000;
        }
        try_files $uri /index.html;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively (Vite adds content hashes to filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE streaming support (for chat)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Proxy uploaded files (bottle images, etc.)
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
